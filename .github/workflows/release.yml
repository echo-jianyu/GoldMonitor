name: Build and Dual Release

# 触发条件：只要推送形如 v1.0.0, v1.0.1 的版本标签就触发
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release to GitHub & Gitee
    runs-on: windows-latest

    steps:
      # 1. 检出仓库源码
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 .NET SDK 编译环境
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. 还原依赖项
      - name: Restore Dependencies
        run: dotnet restore

      # 4. 编译 Release 单文件 EXE（自动注入 Tag 版本号）
      - name: Build Single-File EXE with Version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Building version: $VERSION"
          dotnet build -c Release --no-restore -p:Version=$VERSION -p:FileVersion=$VERSION -p:AssemblyVersion=$VERSION

      # 5. 发布到 GitHub Releases 并上传 EXE
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/bin/Release/net48/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. 将当前的版本 Tag 同步推送到 Gitee（确保 Gitee 拥有该 Tag）
      - name: Sync Tag to Gitee
        shell: bash
        run: |
          git remote add gitee_sync "https://echo-jian:${{ secrets.GITEE_TOKEN }}@gitee.com/echo-jian/gold-monitor.git"
          git push gitee_sync ${{ github.ref_name }} --force

      # 7. 自动创建 Gitee 发行版并同步更新日志与 EXE 附件
      - name: Upload to Gitee Release
        uses: yanglbme/gitee-release-action@main
        with:
          server: 'https://gitee.com'
          owner: echo-jian
          repo: gold-monitor
          tag: ${{ github.ref_name }}
          release_name: ${{ github.event.release.name || github.ref_name }}
          body: ${{ github.event.release.body || '详见 GitHub Release 更新日志。' }}
          file: '**/bin/Release/net48/*.exe'
          token: ${{ secrets.GITEE_TOKEN }}